services:
  web:
    image: python:3.12-slim
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/app:ro
    command: ["python3", "-m", "http.server", "80", "--bind", "0.0.0.0", "--directory", "/app"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
