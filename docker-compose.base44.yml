services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: on-failure
